name: Daily Flight Stalker

on:
  schedule:
    # GitHub cron is always UTC. Riyadh is UTC+3 (no DST) → 01:00 AM Riyadh = 22:00 UTC the day before.
    # GitHub may delay scheduled runs by 5–30 min under load; that is normal.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (search only, no email)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: daily-stalker
  cancel-in-progress: false

jobs:
  stalk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scripts/daily-stalker
        run: npm ci

      - name: Run Daily Stalker
        working-directory: scripts/daily-stalker
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          AMADEUS_API_KEY: ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET: ${{ secrets.AMADEUS_API_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV }}
          ALLOW_SIMULATION: ${{ vars.ALLOW_SIMULATION }}
          SKYSCANNER_MAX_CALLS: ${{ vars.SKYSCANNER_MAX_CALLS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node index.js

      - name: Upload report (dry-run preview)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: scripts/daily-stalker/report.html
